name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # pyproject.toml leaves the demo and bench tests out of the everyday run.
      - name: Test
        run: python -m pytest -q
      - name: Demo, end to end (kiln demo --once)
        run: python -m pytest -q -m demo
      - name: Gateway bench, fast mode
        run: python -m pytest -q -m bench

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test tools/web_tests/*.test.mjs
